<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zx_lib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zx: {
                bg: '#0D0D0D',
                card: '#141414',
                border: '#2A2A2A',
                accent: '#E53E3E',
                'accent-light': '#FF6B4A',
                text: '#F2F2F2',
                muted: '#808080',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'slide-in': 'slideIn 0.3s ease-out forwards', 
              'slide-out-right': 'slideOutRight 0.3s ease-in forwards',
              
              'slide-in-left': 'slideInLeft 0.3s ease-out forwards',
              'slide-out-left': 'slideOutLeft 0.3s ease-in forwards',
              
              'slide-in-top': 'slideInTop 0.3s ease-out forwards',
              'slide-out-top': 'slideOutTop 0.3s ease-in forwards',

              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'fade-out': 'fadeOut 0.2s ease-in forwards',
              
              'scale-in': 'scaleIn 0.2s ease-out forwards',
              'scale-out': 'scaleOut 0.2s ease-in forwards',
              
              'slide-in-right': 'slideInRight 0.3s ease-out forwards',
            },
            keyframes: {
              slideIn: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              slideOutRight: {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(100%)', opacity: '0' },
              },
              slideInLeft: {
                '0%': { transform: 'translateX(-100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              slideOutLeft: {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(-100%)', opacity: '0' },
              },
              slideInTop: {
                '0%': { transform: 'translate(-50%, -100%)', opacity: '0' }, 
                '100%': { transform: 'translate(-50%, 0)', opacity: '1' },
              },
              slideOutTop: {
                '0%': { transform: 'translate(-50%, 0)', opacity: '1' },
                '100%': { transform: 'translate(-50%, -100%)', opacity: '0' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              scaleOut: {
                '0%': { transform: 'scale(1)', opacity: '1' },
                '100%': { transform: 'scale(0.95)', opacity: '0' },
              },
              shrink: {
                '0%': { width: '100%' },
                '100%': { width: '0%' }
              }
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: transparent;
        color: #F2F2F2;
        overflow: hidden; 
      }
      @keyframes shrink {
        0% { width: 100%; }
        100% { width: 0%; }
      }
      
      @keyframes scaleIn {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes radialItemIn {
        0% { transform: scale(0.7); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #141414;
      }
      ::-webkit-scrollbar-thumb {
        background: #323232;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E53E3E;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
